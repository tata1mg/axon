[project]
name = "axon-backend"
version = "0.3.1"
description = "Centralized management API for Axon CLI installations"
authors = [{ name = "1mg Backend Team", email = "backend-team@1mg.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "boto3>=1.43.120",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "opentelemetry-proto==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "sentry-sdk==2.74.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "tortoise-orm>=1.1.9",
    "uvicorn[standard]>=0.54.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-asyncpg==0.66b1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff==0.14.10",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.uv]
package = false
